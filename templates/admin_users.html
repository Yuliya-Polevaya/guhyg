<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stile.css') }}">
</head>
<body>
    <div class="admin-wrapper" style="align-items: flex-start; padding-top: 30px;">
        <div class="admin-card" style="max-width: 800px;">
            <a href="/admin_panel" style="text-decoration: none;">← Назад в меню</a>
            <h3>Профили пользователей</h3>

            <!-- Форма добавления (без пароля, так как он в другой таблице) -->
            <form method="POST" action="/admin_panel/users" style="margin-bottom: 20px;">
                <input type="text" name="u_name" placeholder="Имя" required>
                <input type="number" name="u_age" placeholder="Возраст" required>
                <button type="submit" >Добавить</button>
            </form>

            <table style="width: 100%; border-collapse: collapse;">
                <tr style="background: #f4f4f4;"><th>ID</th><th>Имя</th><th>Возраст</th></tr>
                {% for u in items %}
                <tr style="border-bottom: 1px solid #ddd;">
                    <td style="padding: 10px;">{{ u[0] }}</td>
                    <td style="padding: 10px;">{{ u[1] }}</td>
                    <td style="padding: 10px;">{{ u[2] }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>
</body>
</html>
